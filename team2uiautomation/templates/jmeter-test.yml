spec:
  inputs:
    # 0. Test Strategy Selection (Grafana Tag)
    test_strategy:
      description: "Select the type of test to execute"
      type: string
      default: "api_regression"

    # 1. Number of Threads (CCU)
    ccu_login_register:
      type: number
      default: 1
    ccu_request:
      type: number
      default: 1
    ccu_deposit_withdraw:
      type: number
      default: 1
    ccu_transfer:
      type: number
      default: 1

    # 2. Ramp-up Period (Seconds)
    rampup_login_register:
      type: number
      default: 1
    rampup_request:
      type: number
      default: 1
    rampup_deposit_withdraw:
      type: number
      default: 1
    rampup_transfer:
      type: number
      default: 1

    # 3. Duration (Seconds)
    duration_login_register:
      type: number
      default: 300
    duration_request:
      type: number
      default: 300
    duration_deposit_withdraw:
      type: number
      default: 300
    duration_transfer:
      type: number
      default: 300

---
stages:
  - api_regression

run_api_regression_test:
  stage: api_regression
  timeout: 8h
  image:
    name: justb4/jmeter:latest
    entrypoint: [""] # break out usual jmeter container flow
  rules:
    # Automatically run on MR to main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    # Allowing manual trigger from the web UI
    - if: $CI_PIPELINE_SOURCE == "web"
    # Allow cross-project trigger from team2mockapiautomation (downstream pipeline)
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "schedule"

  tags:
    - qa-automation
  script:
      - echo "Running $[[ inputs.test_strategy ]] tests"
      - rm -rf html_report automation_results.jtl
      - >
        jmeter -n -t api-automation/scripts/api_regression.jmx 
        -Jtest_name=$[[ inputs.test_strategy ]]
        -Jrun_login_register=$[[ inputs.ccu_login_register ]] 
        -Jrampup_login_register=$[[ inputs.rampup_login_register ]] 
        -Jduration_login_register=$[[ inputs.duration_login_register ]] 
        -Jrun_request=$[[ inputs.ccu_request ]] 
        -Jrampup_request=$[[ inputs.rampup_request ]] 
        -Jduration_request=$[[ inputs.duration_request ]] 
        -Jrun_deposit_withdraw=$[[ inputs.ccu_deposit_withdraw ]] 
        -Jrampup_deposit_withdraw=$[[ inputs.rampup_deposit_withdraw ]] 
        -Jduration_deposit_withdraw=$[[ inputs.duration_deposit_withdraw ]] 
        -Jrun_transfer=$[[ inputs.ccu_transfer ]] 
        -Jrampup_transfer=$[[ inputs.rampup_transfer ]] 
        -Jduration_transfer=$[[ inputs.duration_transfer ]] 
        -l automation_results.jtl -e -o html_report
      - awk -F, '$8=="false"{c++} END{if(c>0) {print "Test failures detected!"; exit 1} else print "All tests passed successfully."}' automation_results.jtl
  artifacts:
    when: always
    paths:
      - automation_results.jtl
      - html_report/
    expire_in: 7 days